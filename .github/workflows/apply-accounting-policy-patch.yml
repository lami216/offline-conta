name: Apply accounting policy patch
on:
  push:
    branches:
      - fix/inventory-origin-direct-settlement-20260914
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-accounting-policy-patch.mjs
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Commit verified source changes
        shell: bash
        run: |
          rm scripts/apply-accounting-policy-patch.mjs .github/workflows/apply-accounting-policy-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce inventory origin and invoice settlement"
          git push origin HEAD:fix/inventory-origin-direct-settlement-20260914
