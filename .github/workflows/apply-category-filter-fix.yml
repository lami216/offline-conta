name: Apply category filter and report fixes

on:
  push:
    branches:
      - fix/category-filter-reports-20260908

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/category-filter-reports-20260908
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply scoped patch
        run: node scripts/apply-category-filter-fix.mjs
      - name: Check patch
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Commit validated source changes
        shell: bash
        run: |
          rm -f scripts/apply-category-filter-fix.mjs .github/workflows/apply-category-filter-fix.yml
          git add app/conta-app.tsx app/globals.css tests/category-filter-regression.test.mjs scripts/apply-category-filter-fix.mjs .github/workflows/apply-category-filter-fix.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "lami216"
          git config user.email "iiyad21694@gmail.com"
          git commit -m "Fix category selection and verify report filters"
          git push origin HEAD:fix/category-filter-reports-20260908
