name: Apply combobox blue specificity fix
on:
  push:
    branches: [fix/combobox-blue-specificity-20260908]
permissions:
  contents: write
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply scoped patch
        run: node scripts/apply-combobox-blue-specificity.mjs
      - name: Check patch
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Commit validated source changes
        shell: bash
        run: |
          if git diff --quiet -- app/globals.css; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css
          git commit -m "Fix combobox blue hover specificity"
          git push origin HEAD:fix/combobox-blue-specificity-20260908
