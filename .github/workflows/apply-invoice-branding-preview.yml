name: Apply invoice branding and preview fix

on:
  push:
    branches:
      - invoice-branding-preview-20260905
    paths:
      - .github/workflows/apply-invoice-branding-preview.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: invoice-branding-preview-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused invoice branding fixes
        run: python scripts/apply-invoice-branding-preview-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-invoice-branding-preview.yml scripts/apply-invoice-branding-preview-fix.py
          git add app/domain.ts app/conta-app.tsx app/printing.css lib/invoice-branding.ts tests/printing.test.mjs tests/invoice-branding-logo.test.mjs
          git commit -m "Improve invoice preview branding and contact details"
          git push origin HEAD:invoice-branding-preview-20260905
