name: Apply opening stock audit hardening
on:
  push:
    branches:
      - fix/quantity-money-formatting-20260915
    paths:
      - .github/workflows/apply-opening-stock-audit.yml
permissions:
  contents: write
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/quantity-money-formatting-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply audited opening-stock classification and history changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, value):
              Path(path).write_text(value, encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          def replace_between(text, start, end, replacement, label):
              first = text.find(start)
              if first < 0:
                  raise SystemExit(f"{label}: start marker missing")
              last = text.find(end, first + len(start))
              if last < 0:
                  raise SystemExit(f"{label}: end marker missing")
              return text[:first] + replacement + text[last:]

          stock_movement = '''export type StockMovementDocumentHint = {
            id?: unknown;
            number?: unknown;
            kind?: unknown;
            title?: unknown;
            openingCorrection?: unknown;
            openingStockBefore?: unknown;
            openingStockAfter?: unknown;
          };

          const asText = (value: unknown) => typeof value === "string" ? value.trim() : "";
          const hasOwn = (value: object, key: string) => Object.prototype.hasOwnProperty.call(value, key);

          /**
           * Opening-stock edits existed before the current explicit opening-correction
           * movement type. Document provenance is therefore the durable authority for
           * classifying both current and historical rows.
           */
          export function isOpeningStockCorrectionDocument(document: StockMovementDocumentHint | null | undefined) {
            if (!document || asText(document.kind) !== "adjustment") return false;
            const number = asText(document.number), title = asText(document.title);
            return document.openingCorrection === true
              || number.startsWith("OPEN-COR")
              || title === "تصحيح رصيد البداية"
              || title === "إضافة رصيد افتتاحي"
              || (hasOwn(document, "openingStockBefore") && hasOwn(document, "openingStockAfter"));
          }

          export function isOpeningStockInitialDocument(document: StockMovementDocumentHint | null | undefined) {
            if (!document || asText(document.kind) !== "adjustment" || isOpeningStockCorrectionDocument(document)) return false;
            const number = asText(document.number), title = asText(document.title);
            return title === "رصيد بداية"
              || (/^OPEN(?:-|$)/.test(number) && !number.startsWith("OPEN-COR"))
              || (hasOwn(document, "openingStockAfter") && !hasOwn(document, "openingStockBefore"));
          }

          export function isOpeningStockDocument(document: StockMovementDocumentHint | null | undefined) {
            return isOpeningStockCorrectionDocument(document) || isOpeningStockInitialDocument(document);
          }

          export function classifyStockMovementType(type: unknown, document?: StockMovementDocumentHint | null) {
            if (isOpeningStockCorrectionDocument(document)) return "opening-correction";
            if (isOpeningStockInitialDocument(document)) return "opening";
            return asText(type) || "unknown";
          }

          /** Sale/purchase edit and void movements belong to their parent commercial filter. */
          export function stockMovementMatchesFilter(type: unknown, filter: string | null | undefined) {
            if (!filter) return true;
            const current = asText(type);
            if (filter === "sale") return current === "sale" || current.startsWith("sale-");
            if (filter === "purchase") return current === "purchase" || current.startsWith("purchase-");
            return current === filter;
          }
          '''
          write("app/stock-movement.ts", stock_movement)

          opening_history = '''"use client";
          import { displayDocumentNumber, formatDateTime, money, number, type BootstrapData, type DocumentRecord } from "./domain";
          import { tr } from "./i18n/messages";
          import { isOpeningStockCorrectionDocument, isOpeningStockDocument } from "./stock-movement";

          const finite = (value: unknown) => Number.isFinite(Number(value));

          export default function OpeningStockHistory({ data, docs, openDoc }: { data: BootstrapData; docs: DocumentRecord[]; openDoc: (id: string) => void }) {
            const rows = docs.filter(isOpeningStockDocument).slice().sort((a, b) => String(b.occurredAt).localeCompare(String(a.occurredAt)));
            return <section className="records recent-table opening-stock-history">
              <div className="heading"><h2>{tr("سجل التصحيحات")} — {tr("تصحيح رصيد البداية")}</h2></div>
              <div className="erp-table-wrap"><table className="erp-table" aria-label={`${tr("سجل التصحيحات")} — ${tr("تصحيح رصيد البداية")}`}>
                <thead><tr><th>{tr("رقم")}</th><th>{tr("التاريخ")}</th><th>{tr("المستند")}</th><th>{tr("المنتج")}</th><th>{tr("العملية")}</th><th>{tr("التغيير")}</th><th>{tr("رصيد البداية")}</th><th>{tr("opening.cost")}</th><th>{tr("المخزن")}</th></tr></thead>
                <tbody>{rows.map((document, index) => {
                  const correction = isOpeningStockCorrectionDocument(document);
                  const movements = data.movements.filter(movement => movement.documentId === document.id);
                  const movementDelta = movements.reduce((sum, movement) => sum + Number(movement.quantityDelta ?? 0), 0);
                  const lineDelta = document.lines.reduce((sum, line) => sum + Number(line.quantity ?? 0), 0);
                  const delta = movements.length ? movementDelta : lineDelta;
                  const initialAfter = document.lines.reduce((sum, line) => sum + Math.max(0, Number(line.quantity ?? 0)), 0);
                  const before = correction && finite(document.openingStockBefore) ? Number(document.openingStockBefore) : correction ? null : 0;
                  const after = finite(document.openingStockAfter) ? Number(document.openingStockAfter) : correction ? null : initialAfter;
                  const costBefore = finite(document.openingCostBefore) ? Number(document.openingCostBefore) : null;
                  const costAfter = finite(document.openingCostAfter) ? Number(document.openingCostAfter) : finite(document.lines[0]?.unitPrice) ? Number(document.lines[0]?.unitPrice) : null;
                  const stockBasis = before !== null && after !== null ? `${number(before)} → ${number(after)}` : "—";
                  const cost = costAfter === null ? "—" : correction && costBefore !== null && costBefore !== costAfter ? `${money(costBefore)} → ${money(costAfter)}` : money(costAfter);
                  const productNames = [...new Set(document.lines.map(line => data.products.find(product => product.id === line.productId)?.name ?? line.description.split(" — ")[0]).filter(Boolean))].join("، ") || "—";
                  const from = document.warehouseName || movements[0]?.warehouseName || "—", to = document.destinationWarehouseName;
                  const warehouse = to && to !== from ? `${from} → ${to}` : from;
                  return <tr key={document.id} onClick={() => openDoc(document.id)}><td className="num-cell">{number(index + 1)}</td><td>{formatDateTime(document.occurredAt)}</td><td dir="ltr">{displayDocumentNumber(document)}</td><td className="name-cell">{productNames}</td><td>{correction ? tr("تصحيح رصيد البداية") : tr("رصيد بداية")}</td><td className="num-cell">{delta > 0 ? "+" : ""}{number(delta)}</td><td className="num-cell">{stockBasis}</td><td className="num-cell">{cost}</td><td>{warehouse}</td></tr>;
                })}{!rows.length && <tr><td colSpan={9}>{tr("لا توجد فواتير ضمن الفترة المحددة")}</td></tr>}</tbody>
              </table></div>
            </section>;
          }
          '''
          write("app/opening-stock-history.tsx", opening_history)

          test_source = '''import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test, { after, before, beforeEach } from "node:test";
          import { classifyStockMovementType, isOpeningStockCorrectionDocument, isOpeningStockDocument, stockMovementMatchesFilter } from "../app/stock-movement.ts";
          import { buildReport } from "../lib/reports.ts";
          import { sqliteHarness } from "./sqlite-harness.mjs";

          let harness, db;
          before(async () => { harness = await sqliteHarness(); db = harness.db; });
          beforeEach(async () => { await harness.reset(); });
          after(async () => { await harness.close(); });

          test("opening-stock movement classification repairs current and historical correction labels", () => {
            const current = { kind: "adjustment", number: "OPEN-COR-1", title: "تصحيح رصيد البداية", openingCorrection: true, openingStockBefore: 10, openingStockAfter: 8 };
            const oldAdd = { kind: "adjustment", number: "OPEN-OLD-2", title: "إضافة رصيد افتتاحي" };
            const initial = { kind: "adjustment", number: "OPEN-1", title: "رصيد بداية", openingStockAfter: 10 };
            assert.equal(classifyStockMovementType("unknown", current), "opening-correction");
            assert.equal(classifyStockMovementType("opening", oldAdd), "opening-correction");
            assert.equal(classifyStockMovementType("unknown", initial), "opening");
            assert.equal(isOpeningStockCorrectionDocument(oldAdd), true);
            assert.equal(isOpeningStockDocument(initial), true);
            assert.equal(stockMovementMatchesFilter("sale-edit", "sale"), true);
            assert.equal(stockMovementMatchesFilter("purchase-void", "purchase"), true);
            assert.equal(stockMovementMatchesFilter("opening-correction", "opening"), false);
          });

          test("stock report finds historical opening edits even when their stored movement type was not canonical", async () => {
            await db.collection("products").insertOne({ id: "p", name: "منتج", sku: "P-1", stocks: { w: 8 } });
            await db.collection("documents").insertMany([
              { id: "old", number: "OPEN-OLD-2", kind: "adjustment", status: "posted", title: "إضافة رصيد افتتاحي", occurredAt: "2026-08-10T12:00:00.000Z", total: 0, paidTotal: 0, dueTotal: 0, lines: [] },
              { id: "current", number: "OPEN-COR-3", kind: "adjustment", status: "posted", title: "تصحيح رصيد البداية", openingCorrection: true, openingStockBefore: 10, openingStockAfter: 8, occurredAt: "2026-08-11T12:00:00.000Z", total: 0, paidTotal: 0, dueTotal: 0, lines: [] },
            ]);
            await db.collection("stockMovements").insertMany([
              { id: "m-old", documentId: "old", occurredAt: "2026-08-10T12:00:00.000Z", productId: "p", productName: "منتج", warehouseId: "w", warehouseName: "الرئيسي", type: "opening", balanceBefore: 5, quantityDelta: 5, balanceAfter: 10, documentNumber: "OPEN-OLD-2" },
              { id: "m-current", documentId: "current", occurredAt: "2026-08-11T12:00:00.000Z", productId: "p", productName: "منتج", warehouseId: "w", warehouseName: "الرئيسي", type: "opening-correction", balanceBefore: 10, quantityDelta: -2, balanceAfter: 8, documentNumber: "OPEN-COR-3" },
            ]);
            const report = await buildReport(db, { type: "stock", from: "2026-08-01", to: "2026-08-31", movementType: "opening-correction", page: 1, pageSize: 100 });
            assert.equal(report.meta.totalRows, 2);
            assert.deepEqual(report.rows.map(row => row.movementType), ["opening-correction", "opening-correction"]);
            assert.equal(report.summary.netChange, 3);
          });

          test("bootstrap, reports, UI history and official records share the opening-stock classifier", () => {
            const bootstrap = readFileSync(new URL("../app/api/bootstrap/route.ts", import.meta.url), "utf8");
            const reports = readFileSync(new URL("../lib/reports.ts", import.meta.url), "utf8");
            const app = readFileSync(new URL("../app/conta-app.tsx", import.meta.url), "utf8");
            const history = readFileSync(new URL("../app/opening-stock-history.tsx", import.meta.url), "utf8");
            assert.match(bootstrap, /classifyStockMovementType/);
            assert.match(reports, /stockMovementMatchesFilter/);
            assert.match(app, /"opening-correction":"تصحيح رصيد البداية"/);
            assert.match(app, /OpeningStockHistory/);
            assert.match(app, /isOpeningStockDocument\(record\)/);
            assert.match(history, /money\(costAfter\)/);
            assert.match(history, /number\(delta\)/);
          });
          '''
          write("tests/opening-stock-audit.test.mjs", test_source)

          domain = read("app/domain.ts")
          domain = replace_once(domain,
          '''  title: string | null;\n  total: number;''',
          '''  title: string | null;\n  /** Opening-stock audit metadata for initial balances and later corrections. */\n  openingCorrection?: boolean;\n  openingStockBefore?: number | null;\n  openingStockAfter?: number | null;\n  openingCostBefore?: number | null;\n  openingCostAfter?: number | null;\n  total: number;''',
          "domain opening audit fields")
          write("app/domain.ts", domain)

          bootstrap = read("app/api/bootstrap/route.ts")
          bootstrap = replace_once(bootstrap,
          '''import { getInvoiceBranding } from "../../../lib/invoice-branding";''',
          '''import { getInvoiceBranding } from "../../../lib/invoice-branding";\nimport { classifyStockMovementType } from "../../stock-movement";''',
          "bootstrap classifier import")
          bootstrap = replace_once(bootstrap,
          '''    const cleanCategories = clean(categories).map(category => { const item = category as Record<string, unknown>; return { id: String(item.id ?? ""), name: String(item.name ?? "") }; }).filter(category => category.id && category.name);''',
          '''    const cleanCategories = clean(categories).map(category => { const item = category as Record<string, unknown>; return { id: String(item.id ?? ""), name: String(item.name ?? "") }; }).filter(category => category.id && category.name);\n    const documentHints = new Map(documents.map(document => [String(document.id ?? document._id ?? ""), document]));\n    const cleanMovements = clean(movements).map(movement => ({ ...movement, type: classifyStockMovementType(movement.type, documentHints.get(String(movement.documentId ?? ""))) }));''',
          "bootstrap movement normalization")
          bootstrap = replace_once(bootstrap,
          '''||(hasCapability(principal,"expenses.view")&&document.kind==="expense"));''',
          '''||(hasCapability(principal,"expenses.view")&&document.kind==="expense")||(hasCapability(principal,"warehouses.adjust")&&document.kind==="adjustment"));''',
          "bootstrap adjustment history permission")
          bootstrap = replace_once(bootstrap,
          '''movements:hasCapability(principal,"warehouses.inventory.view")?clean(movements):[]''',
          '''movements:hasCapability(principal,"warehouses.inventory.view")?cleanMovements:[]''',
          "bootstrap normalized movements response")
          write("app/api/bootstrap/route.ts", bootstrap)

          reports = read("lib/reports.ts")
          reports = replace_once(reports,
          '''import { displayDocumentNumber } from "./document-sequences.ts";''',
          '''import { displayDocumentNumber } from "./document-sequences.ts";\nimport { classifyStockMovementType, stockMovementMatchesFilter } from "../app/stock-movement.ts";''',
          "reports classifier import")
          stock_financial_block = '''  if (f.type === "stock") {
            const query: Document = matchDate(f);
            if (constraint) query.productId = constraint;
            const stored = await db.collection("stockMovements").find(query).toArray();
            const documentIds = [...new Set(stored.map(row => String(row.documentId ?? "")).filter(Boolean))];
            const documents = documentIds.length ? await db.collection("documents").find({ id: { $in: documentIds } }).project({ id: 1, number: 1, kind: 1, title: 1, openingCorrection: 1, openingStockBefore: 1, openingStockAfter: 1 }).toArray() : [];
            const documentMap = new Map(documents.map(document => [String(document.id), document]));
            const classified = stored.map(row => ({ ...row, type: classifyStockMovementType(row.type, documentMap.get(String(row.documentId ?? ""))) }));
            const all = f.movementType ? classified.filter(row => stockMovementMatchesFilter(row.type, f.movementType)) : classified;
            const ordered = [...all].sort((a, b) => String(b.occurredAt).localeCompare(String(a.occurredAt)));
            const totalRows = all.length, pageStart = ((f.page ?? 1) - 1) * (f.pageSize ?? 100), raw = f.unpaged ? ordered : ordered.slice(pageStart, pageStart + (f.pageSize ?? 100));
            const products = await db.collection("products").find({ id: { $in: raw.map(row => row.productId) } }).project({ id: 1, sku: 1, name: 1 }).toArray(), identities = new Map(products.map(product => [String(product.id), product]));
            const rows: ReportRow[] = raw.map(row => ({ id: String(row.id), documentId: String(row.documentId), occurredAt: String(row.occurredAt), sku: String(identities.get(String(row.productId))?.sku ?? row.sku ?? "—") || "—", product: String(identities.get(String(row.productId))?.name ?? row.productName ?? "").trim() || "منتج غير متاح", warehouse: String(row.warehouseName), movementType: String(row.type), before: n(row.balanceBefore), change: n(row.quantityDelta), after: n(row.balanceAfter), documentNumber: String(row.documentNumber) }));
            return { report: f.type, from: f.from!, to: f.to!, summary: { movements: totalRows, expiredInventoryLoss: expiryLoss, incoming: all.reduce((sum, row) => sum + Math.max(0, n(row.quantityDelta)), 0), outgoing: all.reduce((sum, row) => sum + Math.abs(Math.min(0, n(row.quantityDelta))), 0), netChange: all.reduce((sum, row) => sum + n(row.quantityDelta), 0) }, rows, meta: pagination(totalRows, f) };
          }
          if (f.type === "financial") {
            const query: Document = matchDate(f);
            if (f.movementType) query.type = ["sale", "purchase"].includes(f.movementType) ? { $regex: `^${f.movementType}(?::|$)` } : f.movementType;
            if (f.paymentAccountId) query.paymentMethod = f.paymentAccountId;
            if (f.direction) query.direction = f.direction;
            const totalRows = await db.collection("financialMovements").countDocuments(query), all = await db.collection("financialMovements").find(query).toArray(), raw = f.unpaged ? [...all].sort((a, b) => String(b.occurredAt).localeCompare(String(a.occurredAt))) : await pageCursor(db.collection("financialMovements").find(query).sort({ occurredAt: -1 }), f).toArray();
            const rows = raw.map(row => ({ id: String(row.id), documentId: String(row.documentId), occurredAt: String(row.occurredAt), paymentMethod: String(row.paymentMethod), movementType: financialMovementKind(row.type), incoming: row.direction === "in" ? n(row.amount) : 0, outgoing: row.direction === "out" ? n(row.amount) : 0, party: String(row.partyName ?? ""), documentNumber: String(row.documentNumber ?? "") }));
            const operating = all.filter(row => isOperatingFinancialMovement(row.type)), businessIncoming = operating.filter(row => row.direction === "in").reduce((sum, row) => sum + n(row.amount), 0), businessOutgoing = operating.filter(row => row.direction === "out").reduce((sum, row) => sum + n(row.amount), 0), balanceNet = all.reduce((sum, row) => sum + (row.direction === "in" ? n(row.amount) : -n(row.amount)), 0);
            return { report: f.type, from: f.from!, to: f.to!, summary: { incoming: all.filter(row => row.direction === "in").reduce((sum, row) => sum + n(row.amount), 0), outgoing: all.filter(row => row.direction === "out").reduce((sum, row) => sum + n(row.amount), 0), net: balanceNet, businessIncoming, businessOutgoing, businessNet: businessIncoming - businessOutgoing, balanceNet, operatingIncoming: businessIncoming, operatingOutgoing: businessOutgoing, operatingNet: businessIncoming - businessOutgoing }, rows, meta: pagination(totalRows, f) };
          }
          '''
          reports = replace_between(reports,
          '''  if (f.type === "stock" || f.type === "financial") {''',
          '''  if (f.type === "debts") {''',
          stock_financial_block,
          "reports stock/financial split")
          write("lib/reports.ts", reports)

          app = read("app/conta-app.tsx")
          app = replace_once(app,
          '''import { translateApiError } from "./i18n/api-errors";''',
          '''import { translateApiError } from "./i18n/api-errors";\nimport OpeningStockHistory from "./opening-stock-history";\nimport { isOpeningStockCorrectionDocument, isOpeningStockDocument } from "./stock-movement";''',
          "app opening audit imports")
          app = replace_once(app,
          '''  const labels: Record<string, string> = { purchase: tr("شراء"), sale: tr("بيع"), transfer: tr("تحويل"), adjustment: tr("تصحيح"), return: tr("حركة تاريخية"), opening: tr("رصيد افتتاحي") };''',
          '''  const labels: Record<string, string> = { purchase: tr("شراء"), sale: tr("بيع"), transfer: tr("تحويل"), adjustment: tr("تصحيح"), return: tr("حركة تاريخية"), opening: tr("رصيد افتتاحي") };\n  const operationLabel = (document: DocumentRecord) => isOpeningStockCorrectionDocument(document) ? tr("تصحيح رصيد البداية") : isOpeningStockDocument(document) ? tr("رصيد بداية") : labels[document.kind] ?? document.kind;''',
          "product movement opening label")
          app = replace_once(app,
          '''{key:"kind",type:"text" as const,get:(d:DocumentRecord)=>labels[d.kind]??d.kind}''',
          '''{key:"kind",type:"text" as const,get:(d:DocumentRecord)=>operationLabel(d)}''',
          "product movement sort label")
          app = replace_once(app,
          '''<td>{labels[document.kind] ?? document.kind}</td>''',
          '''<td>{operationLabel(document)}</td>''',
          "product movement row label")
          adjustment_function = '''function Adjustment(p: {
            data: BootstrapData;
            run: RunCommand;
            openDoc: (id: string) => void;
            prefill?: AdjustmentPrefill | null;
            clearPrefill?: () => void;
          }) {
            const openingDocs = p.data.documents.filter(document => isOpeningStockDocument(document));
            const adjustmentDocs = p.data.documents.filter(document => document.kind === "adjustment" && !isOpeningStockDocument(document));
            return (
              <section className="stock-workspace adjustment-workspace">
                <FramedSection title={tr("تصحيح المخزون")} className="stock-workspace-main" allowOverflow><MultiStockForm {...p} mode="adjust" /></FramedSection>
                <Recent title={tr("سجل التصحيحات")} docs={adjustmentDocs} openDoc={p.openDoc} />
                <OpeningStockHistory data={p.data} docs={openingDocs} openDoc={p.openDoc} />
              </section>
            );
          }
          '''
          app = replace_between(app, '''function Adjustment(p: {''', '''function Records({''', adjustment_function, "adjustment opening history")
          app = replace_once(app,
          '''const movementLabels: Record<string,MessageKey>={sale:"بيع",purchase:"شراء","sale-return":"حركة تاريخية","transfer-in":"تحويل داخل","transfer-out":"تحويل خارج",adjustment:"تصحيح مخزون",opening:"رصيد بداية",expense:"مصروف","party-receipt":"تحصيل من طرف","party-payment":"دفع لطرف",payment:"دفعة",settlement:"تسوية",offset:"مقاصة"};''',
          '''const movementLabels: Record<string,MessageKey>={sale:"بيع","sale-edit":"بيع","sale-void":"بيع",purchase:"شراء","purchase-edit":"شراء","purchase-void":"شراء","sale-return":"حركة تاريخية","transfer-in":"تحويل داخل","transfer-out":"تحويل خارج",adjustment:"تصحيح مخزون",opening:"رصيد بداية","opening-correction":"تصحيح رصيد البداية","legacy-opening":"رصيد بداية",expense:"مصروف","party-receipt":"تحصيل من طرف","party-payment":"دفع لطرف",payment:"دفعة",settlement:"تسوية",offset:"مقاصة"};''',
          "report movement labels")
          app = replace_once(app,
          '''["sale","purchase","transfer-in","transfer-out","adjustment","opening"].includes(k)''',
          '''["sale","purchase","transfer-in","transfer-out","adjustment","opening","opening-correction"].includes(k)''',
          "report opening correction filter")
