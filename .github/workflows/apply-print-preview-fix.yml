name: Apply print preview fidelity fix

on:
  push:
    branches:
      - print-preview-fidelity-20260905
    paths:
      - .github/workflows/apply-print-preview-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: print-preview-fidelity-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused source fixes
        run: python scripts/apply-print-preview-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-print-preview-fix.yml scripts/apply-print-preview-fix.py
          git add app/globals.css app/printing.css app/printing.ts desktop/main.cjs tests/printing.test.mjs
          git commit -m "Fix invoice preview fidelity and thermal page sizing"
          git push origin HEAD:print-preview-fidelity-20260905
