name: Apply printer profiles
on:
  push:
    branches: [printing-profiles-20260905]
    paths:
      - scripts/apply-printing-profiles.py
      - .github/workflows/apply-printing-profiles.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Make the row-label patch resilient
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-printing-profiles.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          lines=[line for line in lines if not ('replace_once("app/conta-app.tsx"' in line and 'presentation.rows?.map' in line)]
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Apply source patch
        run: python scripts/apply-printing-profiles.py
      - name: Add thermal row labels and normalize async UI state
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/conta-app.tsx')
          text=p.read_text(encoding='utf-8')
          old='<td key={j}>{v}</td>'
          if text.count(old) != 1:
              raise SystemExit(f'expected one invoice-cell renderer, got {text.count(old)}')
          p.write_text(text.replace(old,'<td key={j} data-label={presentation.columns?.[j]}>{v}</td>',1),encoding='utf-8')

          p=Path('app/print-settings-panel.tsx')
          text=p.read_text(encoding='utf-8')
          replacements=[
            ('const [busy, setBusy] = useState(""), [message, setMessage] = useState(""), [error, setError] = useState(""), [testPortal, setTestPortal] = useState(false);','const [loadingPrinters, setLoadingPrinters] = useState(false), [saving, setSaving] = useState(false), [testing, setTesting] = useState(false), [message, setMessage] = useState(""), [error, setError] = useState(""), [testPortal, setTestPortal] = useState(false);'),
            ('const refresh = async () => { setBusy("load"); setError(""); try {','const refresh = async () => { setLoadingPrinters(true); setError(""); try {'),
            ('} catch (reason) { setError(reason instanceof Error ? reason.message : String(reason)); } finally { setBusy(""); } };\n  useEffect(() => { void refresh(); }, []);','} catch (reason) { setError(reason instanceof Error ? reason.message : String(reason)); } finally { setLoadingPrinters(false); } };\n  useEffect(() => { void refresh(); }, []);'),
            ('const save = async () => { setBusy("save"); setError(""); setMessage(""); try {','const save = async () => { setSaving(true); setError(""); setMessage(""); try {'),
            ('} catch (reason) { setError(reason instanceof Error ? reason.message : String(reason)); } finally { setBusy(""); } };\n  const test = async () => { setBusy("test");','} catch (reason) { setError(reason instanceof Error ? reason.message : String(reason)); } finally { setSaving(false); } };\n  const test = async () => { setTesting(true);'),
            ('setBusy(""); };\n  const options = useMemo','setTesting(false); };\n  const options = useMemo'),
            ('busy === "load"','loadingPrinters'),
            ('busy !== "load"','!loadingPrinters'),
            ('busy === "save"','saving'),
            ('busy === "test"','testing'),
          ]
          for old,new in replacements:
              if old not in text:
                  raise SystemExit(f'missing print-panel replacement: {old[:100]}')
              text=text.replace(old,new)
          p.write_text(text,encoding='utf-8')
          PY
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Commit validated source
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-printing-profiles.py .github/workflows/apply-printing-profiles.yml
          git add app/conta-app.tsx app/layout.tsx app/desktop-printing.ts app/print-settings-panel.tsx app/printing.css desktop/main.cjs desktop/preload.cjs package.json tests/desktop-printing.test.mjs
          git commit -m "Add configurable desktop invoice printing"
          git push origin HEAD:printing-profiles-20260905
