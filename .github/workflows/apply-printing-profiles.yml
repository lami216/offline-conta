name: Apply printer profiles
on:
  push:
    branches: [printing-profiles-20260905]
    paths:
      - scripts/apply-printing-profiles.py
      - .github/workflows/apply-printing-profiles.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply source patch
        run: python scripts/apply-printing-profiles.py
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Commit validated source
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-printing-profiles.py .github/workflows/apply-printing-profiles.yml
          git add app/conta-app.tsx app/layout.tsx app/desktop-printing.ts app/print-settings-panel.tsx app/printing.css desktop/main.cjs desktop/preload.cjs package.json tests/desktop-printing.test.mjs
          git commit -m "Add configurable desktop invoice printing"
          git push origin HEAD:printing-profiles-20260905
