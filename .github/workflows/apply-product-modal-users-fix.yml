name: Apply product modal and user fixes
on:
  push:
    branches: [fix-product-modal-users-20260908]
permissions:
  contents: write
jobs:
  apply-and-validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-product-modal-users-20260908
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-python@v7
        id: python
        with: {python-version: "3.12"}
      - name: Apply scoped source changes
        shell: pwsh
        run: python scripts/apply-product-modal-users-fix.py
      - name: Verify patch shape
        shell: pwsh
        run: git diff --check
      - name: Configure node-gyp toolchain
        shell: pwsh
        run: |
          "PYTHON=${{ steps.python.outputs.python-path }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GYP_MSVS_VERSION=2022" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run desktop:prepare
      - run: npm run desktop:rebuild-native
      - run: npm run desktop:test-native
      - run: npm run desktop:test-server
      - run: npm run desktop:dist:win
      - run: npm run desktop:test-packaged
      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $artifact = "dist/AlKarna-Setup-x64.exe"
          if (-not (Test-Path $artifact -PathType Leaf)) { throw "Missing Windows artifact: $artifact" }
          if ((Get-Item $artifact).Length -le 1MB) { throw "Windows artifact is truncated" }
      - name: Commit validated application changes
        shell: pwsh
        run: |
          git config user.name "lami216"
          git config user.email "iiyad21694@gmail.com"
          git add -A
          git commit -m "Fix product modal scrolling and user permission form"
          git push origin HEAD:fix-product-modal-users-20260908
