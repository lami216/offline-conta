name: Run quantity and money formatting fix
on:
  push:
    branches:
      - fix/quantity-money-formatting-20260915
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply audited patch
        shell: bash
        run: |
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/apply-quantity-money-format-fix.yml | sed '1d;$d;s/^          //' > /tmp/quantity-money-patch.py
          python /tmp/quantity-money-patch.py
          rm .github/workflows/apply-quantity-money-format-fix-v2.yml
      - name: Commit source and regression tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: separate quantity and monetary displays"
          git push origin HEAD
