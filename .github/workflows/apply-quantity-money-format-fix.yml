name: Apply quantity and money formatting fix
on:
  push:
    branches:
      - fix/quantity-money-formatting-20260915
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply quantity-money formatting patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply audited display formatting changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/conta-app.tsx')
          source = path.read_text(encoding='utf-8')

          def replace_exact(old: str, new: str, expected: int = 1):
              global source
              count = source.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s), found {count}: {old[:120]!r}')
              source = source.replace(old, new)

          # Product discovery: prices are money; stock is quantity.
          replace_exact(
              '<td className="num-cell">{number(mode === "purchase" ? product.lastPurchaseCost ?? product.pieceCost ?? 0 : sellingPrice(product, priceMode))}</td>',
              '<td className="num-cell"><MoneyValue value={mode === "purchase" ? product.lastPurchaseCost ?? product.pieceCost ?? 0 : sellingPrice(product, priceMode)}/></td>',
          )

          # Invoice line totals are monetary values. Editable quantity/price inputs remain raw numeric controls.
          replace_exact(
              '<td className="num-cell">{number(lineTotal)}</td>',
              '<td className="num-cell"><MoneyValue value={lineTotal}/></td>',
          )
          replace_exact(
              '<td className="num-cell">{number(val(line.quantity) * val(line.unitPrice))}</td>',
              '<td className="num-cell"><MoneyValue value={val(line.quantity) * val(line.unitPrice)}/></td>',
          )

          # Inventory: counts/quantities stay unitless; cost and valuation use MRU.
          replace_exact(
              '<small>{tr("قيمة المخزون")}</small><b>{hasInventoryView?number(inventoryValue):"—"}</b>',
              '<small>{tr("قيمة المخزون")}</small><b>{hasInventoryView?money(inventoryValue):"—"}</b>',
          )
          replace_exact(
              '<td className="num-cell">{number(inventoryUnitCost(product))}</td>',
              '<td className="num-cell">{money(inventoryUnitCost(product))}</td>',
          )
          replace_exact(
              '<td className="num-cell">{number(qty(product) * inventoryUnitCost(product))}</td>',
              '<td className="num-cell">{money(qty(product) * inventoryUnitCost(product))}</td>',
          )
          replace_exact(
              '<small>{tr("تكلفة الوحدة")}</small><b>{number(inventoryUnitCost(product))}</b>',
              '<small>{tr("تكلفة الوحدة")}</small><b>{money(inventoryUnitCost(product))}</b>',
          )
          replace_exact(
              '<small>{tr("القيمة في")} {scopeLabel}</small><b>{number(selectedQty * inventoryUnitCost(product))}</b>',
              '<small>{tr("القيمة في")} {scopeLabel}</small><b>{money(selectedQty * inventoryUnitCost(product))}</b>',
          )

          # Product list/details: displayed prices are money; stock stays quantity.
          replace_exact('product.piecePrice == null ? "—" : number(product.piecePrice)', 'product.piecePrice == null ? "—" : money(product.piecePrice)', 2)
          replace_exact('product.wholesalePrice == null ? "—" : number(product.wholesalePrice)', 'product.wholesalePrice == null ? "—" : money(product.wholesalePrice)', 2)
          replace_exact('product.lastPurchaseCost == null ? "—" : number(product.lastPurchaseCost)', 'product.lastPurchaseCost == null ? "—" : money(product.lastPurchaseCost)')
          replace_exact('product.pieceCost == null ? "—" : number(product.pieceCost)', 'product.pieceCost == null ? "—" : money(product.pieceCost)')

          # Every table explicitly labelled as an amount must display currency.
          replace_exact(
              '<td className="num-cell">{number(d.total)}</td>',
              '<td className="num-cell"><MoneyValue value={d.total}/></td>',
          )
          replace_exact(
              '<td className="num-cell">{number(document.total)}</td>',
              '<td className="num-cell"><MoneyValue value={document.total}/></td>',
          )
          replace_exact(
              '{privateAmounts?<MoneyValue value={d.total}/>:number(d.total)}',
              '{privateAmounts?<MoneyValue value={d.total}/>:money(d.total)}',
          )

          # Reports: the declared column type is the single source of truth.
          numeric_line = re.compile(r'^  const numericKeys=new Set\([^\n]+\);\n', re.M)
          monetary_line = re.compile(r'^  const monetaryKeys=new Set\([^\n]+\);\n', re.M)
          source, n_numeric = numeric_line.subn('', source)
          source, n_monetary = monetary_line.subn('', source)
          if n_numeric != 1 or n_monetary != 1:
              raise SystemExit(f'Expected one report key-set pair, got numeric={n_numeric}, monetary={n_monetary}')

          old_display = '  const display=(key:string,value:unknown)=>{if(numericKeys.has(key))return number(reportNumber(value));if(key==="paymentMethod")return accountName(value);if(key==="movementType")return type==="party-ledger"?String(value??"—"):movementLabels[String(value)]?tr(movementLabels[String(value)]):tr("عملية غير معروفة");if(key==="occurredAt"||key==="lastMovement")return value?formatDateTime(String(value)):"—";if(key==="date")return value?formatDate(String(value)):"—";if(typeof value==="number")return number(reportNumber(value));if(typeof value==="boolean")return value?tr("متكرر"):tr("مرة واحدة");return String(value??"—")};'
          new_display = '  const display=(key:string,value:unknown,columnType:TableValueType)=>{if(columnType==="number"){const numeric=Number(value);return value!=null&&value!==""&&Number.isFinite(numeric)?number(numeric):String(value??"—")}if(key==="paymentMethod")return accountName(value);if(key==="movementType")return type==="party-ledger"?String(value??"—"):movementLabels[String(value)]?tr(movementLabels[String(value)]):tr("عملية غير معروفة");if(key==="occurredAt"||key==="lastMovement")return value?formatDateTime(String(value)):"—";if(key==="date")return value?formatDate(String(value)):"—";if(typeof value==="number")return number(reportNumber(value));if(typeof value==="boolean")return value?tr("متكرر"):tr("مرة واحدة");return String(value??"—")};'
          replace_exact(old_display, new_display)

          replace_exact('columns.map(([key])=><td', 'columns.map(([key,,columnType])=><td')
          replace_exact('className={`${numericKeys.has(key)||typeof row[key]==="number"?"num-cell ":""}${key==="occurredAt"?"date-cell":""}`}', 'className={`${columnType==="number"||columnType==="money"?"num-cell ":""}${key==="occurredAt"?"date-cell":""}`}')
          replace_exact('{monetaryKeys.has(key)?<MoneyValue value={reportNumber(row[key])} tone={key==="profit"||key==="net"||key==="balance"?(reportNumber(row[key])>0?"positive":reportNumber(row[key])<0?"negative":"neutral"):"neutral"}/>:display(key,row[key])}', '{columnType==="money"?<MoneyValue value={reportNumber(row[key])} tone={key==="profit"||key==="net"||key==="balance"?(reportNumber(row[key])>0?"positive":reportNumber(row[key])<0?"negative":"neutral"):"neutral"}/>:display(key,row[key],columnType)}')

          path.write_text(source, encoding='utf-8')

          test_path = Path('tests/money-quantity-display.test.mjs')
          test_path.write_text(r'''import assert from "node:assert/strict";
          import test from "node:test";
          import { readFile } from "node:fs/promises";
          import { formatMoney, formatQuantity } from "../app/domain.ts";

          const source = await readFile(new URL("../app/conta-app.tsx", import.meta.url), "utf8");

          test("money carries MRU while quantities remain unitless", () => {
            assert.equal(formatMoney(7), "7 MRU");
            assert.equal(formatQuantity(7), "7");
          });

          test("warehouse movement report uses declared column types instead of key-name currency guesses", () => {
            assert.match(source, /\["before",tr\("قبل"\),"number"\]/);
            assert.match(source, /\["change",tr\("التغيير"\),"number"\]/);
            assert.match(source, /\["after",tr\("بعد"\),"number"\]/);
            assert.doesNotMatch(source, /const monetaryKeys=/);
            assert.doesNotMatch(source, /const numericKeys=/);
            assert.match(source, /columnType==="money"\?<MoneyValue/);
            assert.match(source, /columnType==="number"\|\|columnType==="money"/);
          });

          test("displayed prices, totals, and inventory values use currency formatting", () => {
            const forbidden = [
              /number\(inventoryValue\)/,
              /number\(inventoryUnitCost\(/,
              /number\(selectedQty \* inventoryUnitCost\(/,
              /number\(qty\(product\) \* inventoryUnitCost\(/,
              /number\(lineTotal\)/,
              /number\(document\.total\)/,
              /number\(d\.total\)/,
              /number\(product\.piecePrice\)/,
              /number\(product\.wholesalePrice\)/,
              /number\(product\.lastPurchaseCost\)/,
              /number\(product\.pieceCost\)/,
            ];
            for (const pattern of forbidden) assert.doesNotMatch(source, pattern);
            assert.match(source, /hasInventoryView\?money\(inventoryValue\)/);
            assert.match(source, /money\(inventoryUnitCost\(product\)\)/);
            assert.match(source, /money\(selectedQty \* inventoryUnitCost\(product\)\)/);
            assert.match(source, /<MoneyValue value=\{lineTotal\}\/>/);
            assert.match(source, /<MoneyValue value=\{document\.total\}\/>/);
          });

          test("stock counts and quantities stay plain numbers without MRU", () => {
            assert.match(source, /number\(totalPieces\)/);
            assert.match(source, /number\(qty\(product\)\)/);
            assert.match(source, /number\(selectedQty\)/);
            assert.match(source, /number\(movement\?\.quantityDelta \?\? line\.quantity\)/);
            assert.doesNotMatch(source, /money\(totalPieces\)|money\(qty\(product\)\)|money\(selectedQty\)|money\(current\)|money\(stock\)/);
          });
          ''', encoding='utf-8')

          # Do not keep the one-shot patch workflow in the product branch.
          Path('.github/workflows/apply-quantity-money-format-fix.yml').unlink()
          PY
      - name: Commit patched source and regression tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/conta-app.tsx tests/money-quantity-display.test.mjs .github/workflows/apply-quantity-money-format-fix.yml
          git commit -m "fix: separate quantity and monetary displays"
          git push origin HEAD
