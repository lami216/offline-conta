name: Apply transaction lifecycle UI
on:
  push:
    branches:
      - fix/quantity-money-formatting-20260915
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply UI patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/apply_transaction_lifecycle_ui.py')
          text=path.read_text(encoding='utf-8').replace('tr(\\"ملغى\\")','\\"ملغى\\"')
          path.write_text(text,encoding='utf-8')
          PY
          python scripts/apply_transaction_lifecycle_ui.py
      - name: Commit UI integration
        shell: bash
        run: |
          if git diff --quiet app/conta-app.tsx; then
            echo "No UI changes were produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/conta-app.tsx
          git commit -m "Complete transaction lifecycle controls in UI"
          git push
