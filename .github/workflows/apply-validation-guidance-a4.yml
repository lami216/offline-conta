name: Apply validation guidance and A4 preview fix

on:
  push:
    branches:
      - validation-guidance-a4-20260906
    paths:
      - .github/workflows/apply-validation-guidance-a4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation-guidance-a4-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused fixes
        run: python scripts/apply-validation-guidance-a4.py
      - name: Check diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-validation-guidance-a4.yml scripts/apply-validation-guidance-a4.py
          git add app/conta-app.tsx app/app-confirm.tsx app/globals.css app/printing.css tests/printing.test.mjs tests/validation-guidance.test.mjs
          git commit -m "Refine missing-field guidance and A4 thumbnail"
          git push origin HEAD:validation-guidance-a4-20260906
