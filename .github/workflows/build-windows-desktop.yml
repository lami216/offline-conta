name: Build Windows desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    # Native better-sqlite3 Electron rebuild currently requires the VS2022 toolchain.
    # Do not switch back to windows-latest without validating node-gyp VS2026 support.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-python@v7
        id: python
        with: {python-version: "3.12"}
      - name: Configure node-gyp toolchain
        shell: pwsh
        run: |
          "PYTHON=${{ steps.python.outputs.python-path }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GYP_MSVS_VERSION=2022" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run desktop:prepare
      - run: npm run desktop:rebuild-native
      - run: npm run desktop:test-native
      - run: npm run desktop:test-server
      - run: npm run desktop:dist:win
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/AlKarna-Setup-x64.exe" -PathType Leaf)) { throw "Missing NSIS installer" }
          if (-not (Test-Path "dist/AlKarna-Portable-x64.exe" -PathType Leaf)) { throw "Missing portable executable" }
      - uses: actions/upload-artifact@v7
        with: {name: AlKarna-Windows-x64, path: dist/*.exe}
