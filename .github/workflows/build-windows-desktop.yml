name: Build Windows desktop
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    # Keep the VS2022 image pinned until the complete packaged Windows smoke is green elsewhere.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      # better-sqlite3 13 already ships the N-API binary used by this app. Avoid
      # an unnecessary node-gyp rebuild, then install Electron explicitly.
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      # Production vulnerabilities at high or critical severity must stop distribution.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm run test:production-legacy
      - run: npm run desktop:prepare
      - run: npm run desktop:rebuild-native
      - run: npm run desktop:test-native
      - run: npm run desktop:test-server
      - run: npm run desktop:dist:win
      - run: npm run desktop:test-packaged
      - name: Build Microsoft Store MSIX
        run: npm run desktop:package:store
      - name: Check Store runtime and free manual activation gates
        run: node scripts/desktop-test-server.mjs --packaged --store
      - name: Verify MSIX identity and contents
        shell: pwsh
        run: |
          $identity = Get-Content -LiteralPath build/store-identity.json -Raw | ConvertFrom-Json
          $packages = @(Get-ChildItem -LiteralPath dist/store -Filter '*.msix')
          if ($packages.Count -ne 1) { throw 'Expected exactly one Store MSIX' }
          ./scripts/verify-store-msix.ps1 -PackagePath $packages[0].FullName -IdentityName $identity.identityName -Publisher $identity.publisher
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $artifacts = @("dist/AlKarna-Setup-x64.exe")
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path $artifact -PathType Leaf)) { throw "Missing Windows artifact: $artifact" }
            $file = Get-Item $artifact
            if ($file.Length -le 1MB) { throw "Windows artifact is truncated (must exceed 1 MiB): $artifact ($($file.Length) bytes)" }
            $hash = (Get-FileHash $artifact -Algorithm SHA256).Hash
            "$($hash.ToLowerInvariant()) *$($file.Name)" | Set-Content -Path "$artifact.sha256" -Encoding ascii -NoNewline
            Write-Host "$($file.Name) size=$($file.Length) SHA-256=$hash"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: AlKarna-Windows-x64-${{ github.run_number }}
          path: |
            dist/AlKarna-Setup-x64.exe
            dist/AlKarna-Setup-x64.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: AlKarna-Store-MSIX-${{ github.run_number }}
          path: |
            dist/store/*.msix
            dist/store/*.sha256
            dist/store/BUILD-INFO.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
