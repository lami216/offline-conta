name: Build Windows desktop
on:
  workflow_dispatch:
  push:
    branches: [main, feature/categories-overview-report-i18n]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 8
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-python@v7
        id: python
        with: {python-version: "3.12"}
      - name: Configure node-gyp toolchain
        shell: pwsh
        run: |
          "PYTHON=${{ steps.python.outputs.python-path }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GYP_MSVS_VERSION=2022" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Adjust patch compatibility
        run: python scripts/fix-categories-overview-patch.py
      - name: Apply categories and report patch
        run: python scripts/apply-categories-overview-report-i18n.py
      - name: Remove temporary patch scripts
        shell: pwsh
        run: git rm -f scripts/apply-categories-overview-report-i18n.py scripts/fix-categories-overview-patch.py
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run desktop:prepare
      - run: npm run desktop:rebuild-native
      - run: npm run desktop:test-native
      - run: npm run desktop:test-server
      - run: npm run desktop:dist:win
      - run: npm run desktop:test-packaged
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $artifacts = @("dist/AlKarna-Setup-x64.exe")
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path $artifact -PathType Leaf)) { throw "Missing Windows artifact: $artifact" }
            $file = Get-Item $artifact
            if ($file.Length -le 1MB) { throw "Windows artifact is truncated (must exceed 1 MiB): $artifact ($($file.Length) bytes)" }
            $hash = (Get-FileHash $artifact -Algorithm SHA256).Hash
            Write-Host "$($file.Name) size=$($file.Length) SHA-256=$hash"
          }
      - name: Commit validated source changes
        shell: pwsh
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git restore --staged .github/workflows/build-windows-desktop.yml
          git commit -m "Add product categories and improve comprehensive reports [skip ci]"
          git push origin HEAD:feature/categories-overview-report-i18n
      - uses: actions/upload-artifact@v7
        with:
          name: AlKarna-Windows-x64
          path: dist/AlKarna-Setup-x64.exe
          if-no-files-found: error
