name: Deploy adjustment preview to GitHub Pages

on:
  push:
    branches:
      - preview/adjustment-layout-pages-20260922
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-adjustment-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-preview
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
