name: Validate nullable opening stock audit metadata
on:
  push:
    branches:
      - fix/quantity-money-formatting-20260915
    paths:
      - .github/workflows/fix-opening-null-metadata.yml
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/quantity-money-formatting-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Patch nullable opening-stock metadata handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected 1 match, got {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once('app/stock-movement.ts',
          'const hasOwn = (value: object, key: string) => Object.prototype.hasOwnProperty.call(value, key);\n',
          'const hasOwn = (value: object, key: string) => Object.prototype.hasOwnProperty.call(value, key);\n\n/** Preserve a real numeric zero while treating absent audit metadata as absent. */\nexport function optionalFiniteNumber(value: unknown) {\n  if (value === null || value === undefined || value === "") return null;\n  const numeric = Number(value);\n  return Number.isFinite(numeric) ? numeric : null;\n}\n')

          replace_once('app/opening-stock-history.tsx',
          'import { isOpeningStockCorrectionDocument, isOpeningStockDocument } from "./stock-movement";\n\nconst finite = (value: unknown) => Number.isFinite(Number(value));',
          'import { isOpeningStockCorrectionDocument, isOpeningStockDocument, optionalFiniteNumber } from "./stock-movement";')
          replace_once('app/opening-stock-history.tsx',
          '        const before = correction && finite(document.openingStockBefore) ? Number(document.openingStockBefore) : correction ? null : 0;\n        const after = finite(document.openingStockAfter) ? Number(document.openingStockAfter) : correction ? null : initialAfter;\n        const costBefore = finite(document.openingCostBefore) ? Number(document.openingCostBefore) : null;\n        const costAfter = finite(document.openingCostAfter) ? Number(document.openingCostAfter) : finite(document.lines[0]?.unitPrice) ? Number(document.lines[0]?.unitPrice) : null;',
          '        const before = correction ? optionalFiniteNumber(document.openingStockBefore) : 0;\n        const after = optionalFiniteNumber(document.openingStockAfter) ?? (correction ? null : initialAfter);\n        const costBefore = optionalFiniteNumber(document.openingCostBefore);\n        const costAfter = optionalFiniteNumber(document.openingCostAfter) ?? optionalFiniteNumber(document.lines[0]?.unitPrice);')

          replace_once('app/conta-app.tsx',
          'import { isOpeningStockCorrectionDocument, isOpeningStockDocument } from "./stock-movement";',
          'import { isOpeningStockCorrectionDocument, isOpeningStockDocument, optionalFiniteNumber } from "./stock-movement";')
          old=' if(record.kind==="adjustment"){if(isOpeningStockDocument(record)){const correction=isOpeningStockCorrectionDocument(record),before=Number(record.openingStockBefore),after=Number(record.openingStockAfter),costBefore=Number(record.openingCostBefore),costAfter=Number(record.openingCostAfter),meta:Array<[string,string]>=[...common,[tr("المخزن"),record.warehouseName||"—"]];if(record.destinationWarehouseName&&record.destinationWarehouseName!==record.warehouseName)meta.push([tr("إلى المخزن"),record.destinationWarehouseName]);if(Number.isFinite(before))meta.push([tr("قبل"),number(before)]);if(Number.isFinite(after))meta.push([tr("بعد"),number(after)]);if(Number.isFinite(costBefore))meta.push([`${tr("opening.cost")} — ${tr("قبل")}`,money(costBefore)]);if(Number.isFinite(costAfter))meta.push([`${tr("opening.cost")} — ${tr("بعد")}`,money(costAfter)]);return{title:correction?tr("تصحيح رصيد البداية"):tr("رصيد بداية"),meta,columns:[tr("رقم"),tr("المنتج"),tr("التغيير"),tr("opening.cost")],rows:record.lines.map((l,i)=>[number(i+1),l.description,quantity(l.quantity),money(l.unitPrice)])}}return{title:tr("سند تصحيح مخزون"),meta:[...common,[tr("المخزن"),record.warehouseName||"—"]],columns:[tr("رقم"),tr("المنتج"),tr("الكمية")],rows:record.lines.map((l,i)=>[number(i+1),l.description,quantity(l.quantity)])};}'
          new=' if(record.kind==="adjustment"){if(isOpeningStockDocument(record)){const correction=isOpeningStockCorrectionDocument(record),before=optionalFiniteNumber(record.openingStockBefore),after=optionalFiniteNumber(record.openingStockAfter),costBefore=optionalFiniteNumber(record.openingCostBefore),costAfter=optionalFiniteNumber(record.openingCostAfter)??optionalFiniteNumber(record.lines[0]?.unitPrice),meta:Array<[string,string]>=[...common,[tr("المخزن"),record.warehouseName||"—"]];if(record.destinationWarehouseName&&record.destinationWarehouseName!==record.warehouseName)meta.push([tr("إلى المخزن"),record.destinationWarehouseName]);if(before!==null)meta.push([tr("قبل"),number(before)]);if(after!==null)meta.push([tr("بعد"),number(after)]);if(costBefore!==null)meta.push([`${tr("opening.cost")} — ${tr("قبل")}`,money(costBefore)]);if(costAfter!==null)meta.push([`${tr("opening.cost")} — ${tr("بعد")}`,money(costAfter)]);return{title:correction?tr("تصحيح رصيد البداية"):tr("رصيد بداية"),meta,columns:[tr("رقم"),tr("المنتج"),tr("التغيير"),tr("opening.cost")],rows:record.lines.map((l,i)=>[number(i+1),l.description,quantity(l.quantity),money(l.unitPrice)])}}return{title:tr("سند تصحيح مخزون"),meta:[...common,[tr("المخزن"),record.warehouseName||"—"]],columns:[tr("رقم"),tr("المنتج"),tr("الكمية")],rows:record.lines.map((l,i)=>[number(i+1),l.description,quantity(l.quantity)])};}'
          replace_once('app/conta-app.tsx', old, new)

          replace_once('tests/opening-stock-audit.test.mjs',
          'import { classifyStockMovementType, isOpeningStockCorrectionDocument, isOpeningStockDocument, stockMovementMatchesFilter } from "../app/stock-movement.ts";',
          'import { classifyStockMovementType, isOpeningStockCorrectionDocument, isOpeningStockDocument, optionalFiniteNumber, stockMovementMatchesFilter } from "../app/stock-movement.ts";')
          marker='test("opening-stock movement classification repairs current and historical correction labels", () => {'
          addition='''test("optional opening-stock metadata never invents zero for missing values", () => {\n  assert.equal(optionalFiniteNumber(null), null);\n  assert.equal(optionalFiniteNumber(undefined), null);\n  assert.equal(optionalFiniteNumber(""), null);\n  assert.equal(optionalFiniteNumber("no-number"), null);\n  assert.equal(optionalFiniteNumber(0), 0);\n  assert.equal(optionalFiniteNumber("0"), 0);\n  assert.equal(optionalFiniteNumber("12.5"), 12.5);\n});\n\n'''
          replace_once('tests/opening-stock-audit.test.mjs', marker, addition+marker)
          PY
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Commit validated fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-opening-null-metadata.yml
          git config user.name "lami216"
          git config user.email "iiyad21694@gmail.com"
          git add app tests .github/workflows/fix-opening-null-metadata.yml
          git commit -m "fix: preserve nullable opening stock audit metadata"
          git push origin HEAD:fix/quantity-money-formatting-20260915