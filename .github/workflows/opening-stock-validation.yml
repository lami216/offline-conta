name: Opening stock validation
on:
  push:
    branches: ["fix/editable-opening-stock-cost-basis-20260910"]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply scoped opening-stock patch
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/latestPurchase?.at||item.lastPurchaseAt??null/latestPurchase?.at || (item.lastPurchaseAt ?? null)/g' scripts/apply-opening-stock-fix.py
          python3 -m py_compile scripts/apply-opening-stock-fix.py
          python3 scripts/apply-opening-stock-fix.py
          git diff --check
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit validated app patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/apply-opening-stock-fix.py .github/workflows/opening-stock-audit.yml .github/workflows/opening-stock-validation.yml
          git add app lib tests
          git diff --cached --check
          git commit -m "Make opening stock editable without rewriting sales [skip ci]"
          git push
