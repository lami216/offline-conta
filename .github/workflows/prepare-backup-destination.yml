name: Prepare selectable backup destination
on:
  push:
    branches: [fix/offline-backup-no-shell-picker]
    paths: [.github/workflows/prepare-backup-destination.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'lami216/offline-conta' && github.ref == 'refs/heads/fix/offline-backup-no-shell-picker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Apply exact bounded integration changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          base = '769f9f15af98987824177541b6d9fcf2d233dbb1'
          if subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()!=base:
              raise RuntimeError('Branch changed; refusing to apply stale integration')
          changes = {
          'desktop/main.cjs': [
          ("const {createBackupStore,registerBackupHandlers}=require('./backup-store.cjs');", "const {createBackupStore,registerBackupHandlers}=require('./backup-store.cjs');\nconst {createBackupPicker}=require('./backup-picker.cjs');"),
          (" backupStore=createBackupStore({homeDirectory:app.getPath('home'),log:stamp});", " const backupPicker=createBackupPicker({BrowserWindow,ipcMain,getOwner:()=>window,homeDirectory:app.getPath('home'),getLocale:currentLocale,log:stamp});\n backupStore=createBackupStore({homeDirectory:app.getPath('home'),chooseDestination:()=>backupPicker.choose(),log:stamp});")],
          'desktop/close-flow.cjs': [
          ("if(saveBackup){await saveBackup()}", "if(saveBackup){const saved=await saveBackup();if(saved?.canceled)return false;if(saved?.ok===false)throw Error('backup-save-failed')}"),
          ('La sauvegarde sera enregistrée sans sélecteur de fichiers dans :\\n${backupDirectory}', 'Vous choisirez le dossier et le nom de la sauvegarde dans la fenêtre de l’application (disque local ou clé USB).'),
          ('ستُحفظ النسخة دون نافذة استعراض المجلدات في:\\n${backupDirectory}', 'ستختار المجلد واسم النسخة في نافذة التطبيق، ويمكنك الحفظ على الفلاشة.'),
          ('saveBackup,backupDirectory,getLocale=', 'saveBackup,getLocale=')],
          'app/conta-app.tsx': [
          ('download().then(result=>setMessage(result.saved?', 'download().then(result=>setMessage(result.canceled?"":result.saved?'),
          ('try{await download();await request("/api/settings/restore",selectedFile);', 'try{const safety=await download();if(safety.canceled)return;await request("/api/settings/restore",selectedFile);'),
          ('حفظ مباشر في AlKarna Backups داخل مجلد المستخدم، دون نافذة ويندوز. انسخ النسخة لاحقًا إلى مكان آمن خارج الجهاز.', 'اختر المجلد واسم الملف عند الحفظ، بما في ذلك الفلاشة. تُستخدم نافذة خاصة بالتطبيق بدل نافذة ويندوز المتعطلة.'),
          ('Enregistrement direct dans AlKarna Backups, sous votre dossier utilisateur, sans sélecteur Windows. Conservez aussi une copie hors de cet ordinateur.', 'Choisissez le dossier et le nom, y compris sur une clé USB. La fenêtre de l’application remplace le sélecteur Windows.'),
          ('locale==="ar"?"إنشاء وحفظ": "Créer et enregistrer"', 'locale==="ar"?"إنشاء وحفظ في…": "Créer et enregistrer sous…"')],
          'package.json': [('      "desktop/backup-store.cjs",', '      "desktop/backup-store.cjs",\n      "desktop/backup-picker.cjs",\n      "desktop/backup-picker-preload.cjs",\n      "desktop/backup-picker.html",\n      "desktop/backup-picker-ui.js",')],
          'tests/desktop-close-backup.test.mjs': [('assert.match(dialogs[0].detail,/AlKarna Backups/);', 'assert.match(dialogs[0].detail,/choisirez/);')]
          }
          output={}
          for name, edits in changes.items():
              original = subprocess.check_output(['git','show',base+':'+name]).decode('utf-8')
              current = Path(name).read_text(encoding='utf-8')
              if current != original: raise RuntimeError('Unexpected source change: '+name)
              for old,new in edits:
                  if current.count(old)!=1: raise RuntimeError('Expected one patch site: '+name+' / '+old[:100])
                  current=current.replace(old,new)
              output[name]=current
          for name,text in output.items(): Path(name).write_text(text,encoding='utf-8')
          PY
      - name: Test save selection and close integration
        run: node --test tests/backup-destination.test.mjs tests/desktop-close-backup.test.mjs
      - name: Commit integration and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-backup-destination.yml
          git add desktop/main.cjs desktop/close-flow.cjs app/conta-app.tsx package.json tests/desktop-close-backup.test.mjs
          git diff --cached --stat
          git commit -m 'Wire selectable backup locations and cancel-safe restore/exit'
          git push origin HEAD:refs/heads/fix/offline-backup-no-shell-picker
