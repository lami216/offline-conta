name: Sorting cleanup validation
on:
  push:
    branches: [fix/sorting-cleanup-20260909]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Remove superseded stock helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('app/conta-app.tsx')
          source=path.read_text()
          line='  const stockOf = (product: Product) => Object.values(product.stocks).reduce((sum, value) => sum + Number(value), 0);\n'
          if source.count(line) != 1:
              raise SystemExit('expected exactly one stockOf helper')
          path.write_text(source.replace(line,''))
          PY
      - run: npm ci
      - run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/sorting-cleanup-validation.yml
          git add app/conta-app.tsx
          git diff --cached --check
          git commit -m "Remove superseded sorting helper [skip ci]"
          git push
