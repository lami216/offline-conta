name: Verify PR58 completion

on:
  push:
    branches:
      - fix/opening-stock-integrity-20260910
    paths:
      - .ci/run-pr58-completion

permissions:
  contents: write

jobs:
  complete:
    if: github.event.head_commit.message != 'Apply PR58 completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/opening-stock-integrity-20260910
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: node scripts/pr58-complete.mjs
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Commit verified completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply PR58 completion"
          git push origin HEAD:fix/opening-stock-integrity-20260910
