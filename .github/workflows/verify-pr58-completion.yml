name: Verify PR58 completion

on:
  push:
    branches:
      - fix/opening-stock-integrity-20260910
    paths:
      - .ci/run-pr58-completion

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/opening-stock-integrity-20260910
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
