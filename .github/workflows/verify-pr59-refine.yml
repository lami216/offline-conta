name: Verify PR59 refinement

on:
  push:
    branches:
      - fix/report-date-guards-and-sale-totals-20260910
    paths:
      - .ci/run-pr59-refine

permissions:
  contents: write

jobs:
  refine:
    if: github.event.head_commit.message != 'Apply PR59 refinement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/report-date-guards-and-sale-totals-20260910
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: node scripts/pr59-refine.mjs
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Commit verified refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply PR59 refinement"
          git push origin HEAD:fix/report-date-guards-and-sale-totals-20260910
