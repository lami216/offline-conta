<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>حفظ النسخة الاحتياطية</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#203047;font:14px Tahoma,Arial,sans-serif;height:100vh;display:flex;flex-direction:column}header{padding:18px 22px;background:white;border-bottom:1px solid #dae1e9}h1{font-size:20px;margin:0 0 8px}p{margin:0;color:#586777;line-height:1.7}main{display:flex;flex:1;min-height:0}aside{width:145px;flex-shrink:0;padding:14px 10px;overflow:auto;border-inline-end:1px solid #dae1e9}aside button{display:block;width:100%;margin:0 0 7px;text-align:start}section{padding:14px;flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}button,input{font:inherit}button{cursor:pointer;background:white;border:1px solid #cbd5e1;border-radius:6px;padding:9px 12px;color:inherit}button:hover:not(:disabled){background:#e7f3f1}button:focus-visible,input:focus-visible{outline:2px solid #147d70;outline-offset:2px}button:disabled{opacity:.5;cursor:default}.row{display:flex;gap:8px;align-items:center}.row input{min-width:0;flex:1}input{padding:9px 10px;border:1px solid #cbd5e1;border-radius:6px;background:white;width:100%}.primary{background:#107c6e;color:white;border-color:#107c6e}.primary:hover:not(:disabled){background:#075e53}.files{background:white;border:1px solid #dae1e9;border-radius:6px;overflow:auto;flex:1;min-height:80px}.files button{display:block;border:0;border-radius:0;border-bottom:1px solid #f0f2f5;padding:10px 12px;text-align:start;width:100%;overflow-wrap:anywhere}.files .backup{color:#607083;cursor:default}.status{min-height:22px;font-size:13px;color:#586777}.error{color:#a51c30}footer{padding:14px 20px;border-top:1px solid #dae1e9;background:white;display:grid;gap:10px}.actions{justify-content:flex-end}.hint{font-size:12px}#new-row[hidden]{display:none}#path{direction:ltr;text-align:left}label{font-weight:bold}#drives button{direction:ltr}.empty{padding:18px;color:#6b7787}
</style></head><body>
<header><h1 id="title">حفظ النسخة الاحتياطية</h1><p id="subtitle">اختر المجلد أو الفلاشة، ثم اسم الملف. لن تُستبدل أي نسخة سابقة.</p></header>
<main><aside><button id="home" type="button">مجلد المستخدم</button><button id="refresh-drives" type="button">تحديث الأقراص / USB</button><div id="drives"></div></aside><section>
<div class="row"><button id="up" type="button">أعلى</button><input id="path" aria-label="مسار المجلد" placeholder="E:\" autocomplete="off" spellcheck="false"><button id="go" type="button">انتقال</button></div>
<div class="row"><input id="search" aria-label="بحث في المجلد" placeholder="بحث في المجلد" autocomplete="off"><button id="search-go" type="button">بحث</button><button id="new" type="button">مجلد جديد</button></div>
<div class="row" id="new-row" hidden><input id="new-name" aria-label="اسم المجلد الجديد" autocomplete="off"><button id="create" type="button">إنشاء</button></div>
<div class="files" id="files" role="group" aria-label="المجلدات والنسخ"></div><div class="status" id="status" role="status" aria-live="polite"></div>
</section></main>
<footer><label for="filename" id="filename-label">اسم الملف</label><input id="filename" autocomplete="off" spellcheck="false"><p class="hint" id="format">نسخة الكرنه (.conta.json) — يمكنك إلغاء العملية دون تغيير البيانات.</p><div class="row actions"><button id="cancel" type="button">إلغاء</button><button id="save" type="button" class="primary">حفظ هنا</button></div></footer>
<script src="backup-picker-ui.js"></script></body></html>
